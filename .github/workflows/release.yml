name: Create Release on Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        run: |
          # Get commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline --no-decorate)
          else
            COMMITS=$(git log --oneline --no-decorate ${PREV_TAG}..HEAD)
          fi

          # Save to file for multiline output
          echo "$COMMITS" > release_notes.txt

      - name: Create unitypackage
        run: |
          chmod +x ./scripts/create-unitypackage.sh
          ./scripts/create-unitypackage.sh Assets/Plugins/ClaudeAgent ClaudeAgent-${{ steps.tag.outputs.tag }}.unitypackage

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: release_notes.txt
          files: ClaudeAgent-${{ steps.tag.outputs.tag }}.unitypackage
          draft: false
          prerelease: false
